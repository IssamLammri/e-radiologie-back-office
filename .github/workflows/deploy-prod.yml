name: Deploy E-radiologie Backoffice

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Build and deploy Backoffice
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Cette modification existe UNIQUEMENT dans le runner GitHub.
      # Aucun changement n'est renvoyé dans le dépôt.
      - name: Fix Vue Router compatibility
        run: |
          npm pkg set dependencies.vue-router="^4.5.1"

      # On utilise npm install car Google AI Studio ne fournit
      # pas nécessairement de package-lock.json
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          test -n "$VPS_HOST" || { echo "Missing repository secret VPS_HOST in e-radiologie-back-office"; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo "Missing repository secret VPS_SSH_KEY in e-radiologie-back-office"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Load public frontend configuration from server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          test -n "$VPS_USER" || { echo "Missing repository secret VPS_USER in e-radiologie-back-office"; exit 1; }
          ssh "$VPS_USER@$VPS_HOST" 'set -eu
            config="$HOME/projets/e-radiologie-back-office/.env.local"
            if [ ! -f "$config" ]; then
              echo "Missing $config on the VPS" >&2
              exit 1
            fi
            value=$(sed -n "s/^VITE_API_BASE_URL=//p" "$config" | tail -n 1)
            if [ -z "$value" ]; then
              echo "VITE_API_BASE_URL is missing or empty in $config" >&2
              exit 1
            fi
            printf "VITE_API_BASE_URL=%s\\n" "$value"
          ' > .env.local
          grep -q '^VITE_API_BASE_URL=.' .env.local || {
            echo "The VPS did not return a valid VITE_API_BASE_URL"
            exit 1
          }

      - name: Build production
        run: npm run build

      - name: Verify build
        run: |
          test -f dist/index.html
          test -d dist/assets
          echo "Build OK"

      - name: Prepare deployment directory
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" '
            set -e
            rm -rf ~/deploy-e-radiologie-backoffice
            mkdir -p ~/deploy-e-radiologie-backoffice
          '

      - name: Upload Backoffice
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete \
            dist/ \
            "$VPS_USER@$VPS_HOST:~/deploy-e-radiologie-backoffice/"

      - name: Publish website
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" '
            set -e

            sudo mkdir -p /var/www/admin.e-radiologie.com

            sudo rsync -a --delete \
              ~/deploy-e-radiologie-backoffice/ \
              /var/www/admin.e-radiologie.com/

            sudo chown -R www-data:www-data \
              /var/www/admin.e-radiologie.com

            sudo find /var/www/admin.e-radiologie.com \
              -type d -exec chmod 755 {} \;

            sudo find /var/www/admin.e-radiologie.com \
              -type f -exec chmod 644 {} \;

            rm -rf ~/deploy-e-radiologie-backoffice
          '

      - name: Verify deployment
        run: |
          sleep 3

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            https://admin.e-radiologie.com/ \
            > /dev/null

          echo "E-radiologie Backoffice is online"

      - name: Deployment completed
        run: |
          echo "Deployment completed successfully"
          echo "https://admin.e-radiologie.com"
