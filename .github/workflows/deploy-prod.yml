name: Deploy E-radiologie Backoffice

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and deploy Backoffice
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------
      # Checkout
      # ---------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # ---------------------------------------------
      # Node.js
      # ---------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      # ---------------------------------------------
      # Dependencies
      # ---------------------------------------------
      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------
      # Build production
      # ---------------------------------------------
      - name: Build production
        env:
          VITE_API_BASE_URL: https://api.e-radiologie.com
        run: npm run build

      # ---------------------------------------------
      # Verify build
      # ---------------------------------------------
      - name: Verify build
        run: |
          test -f dist/index.html
          test -d dist/assets
          echo "Build OK"

      # ---------------------------------------------
      # SSH configuration
      # ---------------------------------------------
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # ---------------------------------------------
      # Prepare temporary directory
      # ---------------------------------------------
      - name: Prepare deployment directory
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" '
            set -e
            rm -rf ~/deploy-e-radiologie-backoffice
            mkdir -p ~/deploy-e-radiologie-backoffice
          '

      # ---------------------------------------------
      # Upload dist
      # ---------------------------------------------
      - name: Upload Backoffice
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete \
            dist/ \
            "$VPS_USER@$VPS_HOST:~/deploy-e-radiologie-backoffice/"

      # ---------------------------------------------
      # Publish
      # ---------------------------------------------
      - name: Publish website
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" '
            set -e

            sudo mkdir -p /var/www/admin.e-radiologie.com

            sudo rsync -a --delete \
              ~/deploy-e-radiologie-backoffice/ \
              /var/www/admin.e-radiologie.com/

            sudo chown -R www-data:www-data \
              /var/www/admin.e-radiologie.com

            sudo find /var/www/admin.e-radiologie.com \
              -type d -exec chmod 755 {} \;

            sudo find /var/www/admin.e-radiologie.com \
              -type f -exec chmod 644 {} \;

            rm -rf ~/deploy-e-radiologie-backoffice
          '

      # ---------------------------------------------
      # Verify production
      # ---------------------------------------------
      - name: Verify deployment
        run: |
          sleep 3

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            https://admin.e-radiologie.com/ \
            > /dev/null

          echo "E-radiologie Backoffice is online"

      # ---------------------------------------------
      # Done
      # ---------------------------------------------
      - name: Deployment completed
        run: |
          echo "Deployment completed successfully"
          echo "https://admin.e-radiologie.com"