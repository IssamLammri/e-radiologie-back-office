name: Deploy E-radiologie Backoffice

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and deploy Backoffice
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Récupération du code
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Installation de Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # --------------------------------------------------
      # 3. Installation des dépendances
      # --------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------
      # 4. Build Vue / Vite
      # --------------------------------------------------
      - name: Build production
        env:
          VITE_API_BASE_URL: https://api.e-radiologie.com
        run: npm run build

      # --------------------------------------------------
      # 5. Vérification du build
      # --------------------------------------------------
      - name: Check build
        run: |
          test -f dist/index.html
          test -d dist/assets
          echo "Build OK"

      # --------------------------------------------------
      # 6. Configuration SSH
      # --------------------------------------------------
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # --------------------------------------------------
      # 7. Création du dossier temporaire sur le VPS
      # --------------------------------------------------
      - name: Prepare deployment directory
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" "
            rm -rf ~/deploy-e-radiologie-backoffice &&
            mkdir -p ~/deploy-e-radiologie-backoffice
          "

      # --------------------------------------------------
      # 8. Envoi du build sur le VPS
      # --------------------------------------------------
      - name: Upload Backoffice
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az \
            --delete \
            dist/ \
            "$VPS_USER@$VPS_HOST:~/deploy-e-radiologie-backoffice/"

      # --------------------------------------------------
      # 9. Publication dans le dossier Nginx
      # --------------------------------------------------
      - name: Publish website
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" "
            set -e

            sudo mkdir -p /var/www/admin.e-radiologie.com

            sudo rsync -a --delete \
              ~/deploy-e-radiologie-backoffice/ \
              /var/www/admin.e-radiologie.com/

            sudo chown -R www-data:www-data \
              /var/www/admin.e-radiologie.com

            sudo find /var/www/admin.e-radiologie.com \
              -type d -exec chmod 755 {} \;

            sudo find /var/www/admin.e-radiologie.com \
              -type f -exec chmod 644 {} \;

            rm -rf ~/deploy-e-radiologie-backoffice
          "

      # --------------------------------------------------
      # 10. Vérification du déploiement
      # --------------------------------------------------
      - name: Check deployed website
        run: |
          sleep 3
          curl --fail --silent --show-error \
            --retry 3 \
            https://admin.e-radiologie.com/ \
            > /dev/null

          echo "Backoffice is online"

      # --------------------------------------------------
      # 11. Fin
      # --------------------------------------------------
      - name: Deployment completed
        run: |
          echo "Deployment completed successfully"
          echo "https://admin.e-radiologie.com"